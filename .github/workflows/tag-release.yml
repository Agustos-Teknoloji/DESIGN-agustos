# Tags each release when it reaches main, so a release made from a local or a
# cloud session ends the same way. This is the repository's only workflow and
# it runs no tests: the pre-push hook (scripts/ci.sh) stays the CI.
# MEMORY.md 2026-09-30 release-tags-on-main.
name: Tag release

# Every push to main, not only a VERSION change: a run with nothing to tag
# takes seconds, and a failed run heals on the next push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Plain git instead of a third-party checkout action: full history and
      # tags are needed to find the commit that shipped each version.
      - name: Clone main with its tags
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --quiet "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          git -C repo checkout --quiet "${GITHUB_SHA}"
      - name: Tag every untagged release
        working-directory: repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 scripts/release_tags.py --push
